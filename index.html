<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boggle board</title>
<style>
  :root {
    --bg: #e9edf0;
    --tray: #2f4a57;
    --well: #1f3540;
    --die: #f6f1e4;
    --die-edge: #cfc6ae;
    --ink: #14232b;
    --accent: #c2410c;
    --accent-ink: #fff;

    --pad: 16px;
    --gap: 16px;
    --side: 150px;      /* control column width (landscape) */
    --ctrl-h: 56px;     /* control row height (portrait) */
    --av-w: calc(100vw - 2 * var(--pad));
    --av-h: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 2 * var(--pad));
    /* portrait: controls above board */
    --board-w: min(var(--av-w), calc(var(--av-h) - var(--ctrl-h) - var(--gap)));

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* landscape: controls beside board */
  @media (min-aspect-ratio: 1/1) {
    :root { --board-w: min(calc(var(--av-w) - var(--side) - var(--gap)), var(--av-h)); }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11191d; --tray: #2a414d; --well: #17262d;
      --die: #ece6d4; --die-edge: #b9b098; --ink: #e7edf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11191d; --tray: #2a414d; --well: #17262d;
    --die: #ece6d4; --die-edge: #b9b098; --ink: #e7edf0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: calc(var(--av-h) + 2 * var(--pad));
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Arial, system-ui, sans-serif;
    padding: var(--pad);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap);
  }
  @media (min-aspect-ratio: 1/1) { body { flex-direction: row; } }

  .controls { display: flex; gap: 12px; align-items: stretch; justify-content: center; height: var(--ctrl-h); }
  @media (min-aspect-ratio: 1/1) {
    .controls { flex-direction: column; width: var(--side); height: auto; justify-content: center; gap: 16px; }
  }
  .sizes { display: flex; border: 2px solid var(--tray); border-radius: 8px; overflow: hidden; }
  .sizes button {
    font: inherit; font-weight: 600; padding: 10px 16px; border: 0; background: transparent;
    color: var(--ink); cursor: pointer; min-width: 56px;
  }
  .sizes button + button { border-left: 2px solid var(--tray); }
  .sizes button[aria-pressed="true"] { background: var(--tray); color: #fff; }
  @media (min-aspect-ratio: 1/1) {
    .sizes { flex-direction: column; }
    .sizes button { padding: 16px; font-size: 20px; }
    .sizes button + button { border-left: 0; border-top: 2px solid var(--tray); }
  }
  #shuffle {
    font: inherit; font-weight: 700; padding: 10px 24px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  @media (min-aspect-ratio: 1/1) { #shuffle { padding: 20px 16px; font-size: 20px; } }
  #shuffle:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .tray { background: var(--tray); padding: calc(var(--board-w) * 0.035); border-radius: 14px; width: var(--board-w); flex: none; }
  .grid {
    display: grid; gap: calc(var(--board-w) / var(--n) * 0.08);
    grid-template-columns: repeat(var(--n), 1fr);
    background: var(--well); padding: calc(var(--board-w) * 0.02); border-radius: 8px;
  }
  .die {
    aspect-ratio: 1; background: var(--die); border-radius: 12%;
    box-shadow: inset 0 -3px 0 var(--die-edge), 0 1px 2px rgba(0,0,0,.4);
    display: grid; place-items: center; color: #14232b; font-weight: 700;
    font-size: calc(var(--board-w) / var(--n) * 0.48);
    user-select: none;
    transform: rotate(var(--r, 0deg));
  }
  .die.mark { text-decoration: underline; text-decoration-thickness: .07em; text-underline-offset: .1em; }
  .die.long { font-size: calc(var(--board-w) / var(--n) * 0.36); }
  .die.shake { animation: roll .28s ease-out; }
  @keyframes roll { from { transform: rotate(calc(var(--r) + 90deg)) scale(.85); opacity: .4; } to { transform: rotate(var(--r)); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .die.shake { animation: none; } }
</style>
</head>
<body>

<div class="controls">
  <div class="sizes" role="group" aria-label="Board size" id="sizes"></div>
  <button id="shuffle" type="button">Shuffle</button>
</div>

<div class="tray"><div class="grid" id="grid" aria-live="polite"></div></div>

<script>
/* ===== CONFIG ===================================================
   Dice data. 4x4 and 5x5 sets are the dice listed in the Duke CPS100e
   StandardBoardMaker.java reference (Boggle 16 dice / Big Boggle 25 dice).
   Source: https://courses.cs.duke.edu/spring11/cps100e/assign/boggle/code/StandardBoardMaker.html
   'q' renders as "Qu".
   6x6 / 7x7: NO official set verified. Built from the 41 dice above
   (see buildDiceSet). Not the Super Big Boggle set.
================================================================== */
const DICE_16 = [
  "aaeegn","abbjoo","achops","affkps","aoottw","cimotu","deilrx","delrvy",
  "distty","eeghnw","eeinsu","ehrtvw","eiosst","elrtty","himnqu","hlnnrz"
];
const DICE_25 = [
  "aafirs","adennn","aaafrs","aeegmu","aaeeee","aeeeem","afirsy","aegmnn","bjkqxz",
  "ceipst","ceiilt","ccnstw","ceilpt","ddlonr","dhlnor","dhhlor","dhhnot","ensssu",
  "emottt","eiiitt","fiprsy","gorrvw","hiprry","nootuw","ooottu"
];
const SIZES = [4, 5, 6, 7];
const MARKED = ["M", "W", "N", "Z"]; // underlined: disambiguates M/W and N/Z under rotation
const VOWELS = "aeiou";           // Y and Qu count as consonants
const MIN_VOWEL_RATIO = 0.25;      // board is re-rolled if vowels fall outside
const MAX_VOWEL_RATIO = 0.50;      // [ceil(N*min), floor(N*max)]

/* ===== LOGIC ================================================= */
function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDiceSet(n) {
  const need = n * n;
  if (n === 4) return DICE_16.slice();
  if (n === 5) return DICE_25.slice();
  const pool = DICE_16.concat(DICE_25);                  // 41 dice
  if (need <= pool.length) return shuffleInPlace(pool.slice()).slice(0, need);
  const extra = [];
  while (pool.length + extra.length < need)              // reuse dice when pool < need
    extra.push(pool[Math.floor(Math.random() * pool.length)]);
  return pool.concat(extra);
}

function rollOnce(n) {
  const dice = shuffleInPlace(buildDiceSet(n));          // random position per die
  return dice.map(d => d[Math.floor(Math.random() * 6)]); // random up-face per die
}

function rollBoard(n) {
  const N = n * n, lo = Math.ceil(N * MIN_VOWEL_RATIO), hi = Math.floor(N * MAX_VOWEL_RATIO);
  for (;;) {                                             // reject all-vowel / all-consonant style boards
    const b = rollOnce(n);
    const v = b.filter(c => VOWELS.includes(c)).length;
    if (v >= lo && v <= hi) return b;
  }
}

/* ===== UI ==================================================== */
let size = 4;
let board = [];
const gridEl = document.getElementById("grid");
const sizesEl = document.getElementById("sizes");

function render() {
  gridEl.style.setProperty("--n", size);
  gridEl.innerHTML = "";
  board.forEach(ch => {
    const el = document.createElement("div");
    const label = ch === "q" ? "Qu" : ch.toUpperCase();
    el.className = "die shake" + (label.length > 1 ? " long" : "") + (MARKED.includes(label) ? " mark" : "");
    el.style.setProperty("--r", (Math.floor(Math.random() * 4) * 90) + "deg"); // 0/90/180/270, independent per die
    el.textContent = label;
    gridEl.appendChild(el);
  });
}

function shuffle() { board = rollBoard(size); render(); }

SIZES.forEach(n => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = n + "×" + n;
  b.setAttribute("aria-pressed", n === size);
  b.addEventListener("click", () => {
    size = n;
    [...sizesEl.children].forEach((x, i) => x.setAttribute("aria-pressed", SIZES[i] === n));
    shuffle();
  });
  sizesEl.appendChild(b);
});
document.getElementById("shuffle").addEventListener("click", shuffle);
shuffle();
</script>
</body>
</html>
